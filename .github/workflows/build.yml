name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create 8GB Swap Space
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Memory after adding swap:"
          free -h

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git unzip wget zip autoconf automake libtool pkg-config zlib1g-dev libncurses-dev libtinfo-dev cmake libffi-dev libssl-dev ccache
          pip3 install --upgrade pip setuptools wheel
          pip3 install buildozer cython virtualenv

      - name: Generate buildozer.spec dynamically
        run: |
          cat << 'SPEC' > buildozer.spec
          [app]
          title = DownSuVid
          package.name = downsuviid
          package.domain = com.downsuviid
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,ttf
          source.exclude_dirs = tests,docs,.git,.github,.buildozer,venv,__pycache__,assets/splash,assets/icons
          version = 1.0.0
          requirements = python3,kivy,kivymd,yt-dlp,certifi,urllib3,httpx,aiofiles,Pillow
          orientation = portrait
          fullscreen = 0
          android.presplash_color = #1A237E
          android.permissions = INTERNET,ACCESS_NETWORK_STATE,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE
          android.api = 33
          android.minapi = 26
          android.sdk = 33
          android.ndk = 25b
          android.ndk_api = 26
          android.private_storage = True
          android.accept_sdk_agreement = True
          android.entrypoint = org.kivy.android.PythonActivity
          p4a.branch = develop
          p4a.bootstrap = sdl2
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPEC
          echo "buildozer.spec has been generated successfully."

      - name: Build APK
        run: yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DownSuVid-APK
          path: bin/*.apk
